<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc"><title id="title">Kaboo 客户端菜单栏快照更新流程</title><desc id="desc">菜单栏优先读取可用快照，后台受控更新；达到单轮上限后保留进度，合并可用字段并校验版本发布。日志扫描与上报独立。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#8ba3c0" stroke-width="1.5"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#293b53;text-anchor:middle}.title{font-size:17px;font-weight:600}.sub{font-size:13px;fill:#64768e}.edge{font-size:12px;fill:#64768e;paint-order:stroke;stroke:#f8fbff;stroke-width:6px}.wire{fill:none;stroke:#8ba3c0;stroke-width:1.7}</style><rect width="960" height="730" rx="10" fill="#f8fbff"/><text x="32" y="29" class="sub" style="text-anchor:start">KABOO CLIENT / 菜单栏展示与后台刷新</text><path d="M288 144H350" class="wire"  marker-end="url(#arrow)"/><path d="M608 144H670" class="wire"  marker-end="url(#arrow)"/><path d="M800 100V67H160V98" class="wire"  marker-end="url(#arrow)"/><text x="480" y="58" class="edge">优先返回当前可用快照</text><path d="M480 188V284" class="wire"  marker-end="url(#arrow)"/><text x="568" y="239" class="edge">需要更新时，异步构建</text><path d="M288 328H350" class="wire"  marker-end="url(#arrow)"/><path d="M608 328H670" class="wire"  marker-end="url(#arrow)"/><text x="640" y="314" class="edge">到达上限</text><path d="M800 372V416H630V350H610" class="wire" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="770" y="409" class="edge">余量交给后续更新</text><path d="M480 372V491" class="wire"  marker-end="url(#arrow)"/><text x="439" y="467" class="edge">本轮结果</text><path d="M800 188H944V451H528V491" class="wire" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="735" y="445" class="edge">缺失字段按条件复用缓存</text><path d="M608 537H670" class="wire"  marker-end="url(#arrow)"/><rect x="32" y="100" width="256" height="88" rx="9" fill="#ffffff" stroke="#d7e2ef"/><text x="160" y="128" class="title">菜单栏面板</text><text x="160" y="149" class="sub">读取展示快照</text><text x="160" y="168" class="sub">Token / 图表 / 额度 / 状态</text><rect x="352" y="100" width="256" height="88" rx="9" fill="#ffffff" stroke="#d7e2ef"/><text x="480" y="128" class="title">本机快照接口</text><text x="480" y="149" class="sub">读取已有快照</text><text x="480" y="168" class="sub">无缓存则返回占位数据</text><rect x="672" y="100" width="256" height="88" rx="9" fill="#ffffff" stroke="#d7e2ef"/><text x="800" y="128" class="title">最近可用快照</text><text x="800" y="149" class="sub">缓存汇总 JSON</text><text x="800" y="168" class="sub">用于快速展示与失败回退</text><rect x="32" y="284" width="256" height="88" rx="9" fill="#ffffff" stroke="#d7e2ef"/><text x="160" y="312" class="title">统计与额度来源</text><text x="160" y="333" class="sub">按模块获取所需数据</text><text x="160" y="352" class="sub">日志扫描与用量上报独立</text><rect x="352" y="284" width="256" height="88" rx="9" fill="#eaf3ff" stroke="#85aad5"/><text x="480" y="312" class="title">后台单轮限量更新</text><text x="480" y="333" class="sub">分批处理，控制本轮规模</text><text x="480" y="352" class="sub">达到上限即停止继续处理</text><rect x="672" y="284" width="256" height="88" rx="9" fill="#eaf3ff" stroke="#85aad5"/><text x="800" y="312" class="title">保留结果与续跑进度</text><text x="800" y="333" class="sub">保留已完成部分</text><text x="800" y="352" class="sub">剩余工作后续接续</text><rect x="352" y="493" width="256" height="88" rx="9" fill="#ffffff" stroke="#d7e2ef"/><text x="480" y="521" class="title">合并可用数据分区</text><text x="480" y="542" class="sub">失败缺失字段按条件复用</text><text x="480" y="561" class="sub">成功空结果保留真实语义</text><rect x="672" y="493" width="256" height="88" rx="9" fill="#ffffff" stroke="#d7e2ef"/><text x="800" y="521" class="title">校验后发布快照</text><text x="800" y="542" class="sub">设置与账号版本校验</text><text x="800" y="561" class="sub">供菜单栏读取与展示</text><text x="160" y="520" class="sub">已有任务运行时不重复启动刷新</text><text x="160" y="546" class="sub">构建器加锁协调更新</text><rect x="32" y="636" width="896" height="64" rx="8" fill="#f0f5fc"/><text x="480" y="662" class="sub">单轮更新平均耗时 1.5 秒 · 未完成内容后续继续 · 不代表全量日志重算时间</text><text x="480" y="686" class="sub">蓝色：本人确认的限量更新优化；白色：仓库已有的读取、缓存与发布机制。</text></svg>
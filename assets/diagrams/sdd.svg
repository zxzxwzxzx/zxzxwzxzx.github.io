A</text><text x="1094" y="675" font-size="23" fill="#594478" font-weight="650" text-anchor="start">AI</text><text x="1094" y="705" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">证据 · 候选方案 · 草拟 · 挑战</text><rect x="1736" y="135" width="302" height="376" rx="25" fill="#eaf8ef" stroke="#92d8ae" stroke-width="2"/><text x="1887" y="175" font-size="26" fill="#233a30" font-weight="700" text-anchor="middle">明确的目标和验收结果</text><rect x="1765" y="295" width="147" height="31" rx="17" fill="#d7f0e1" stroke="#d7f0e1" stroke-width="2"/><text x="1838" y="318" font-size="15" fill="#327456" font-weight="700" text-anchor="middle">REVIEW-READY</text><text x="1765" y="366" font-size="25" fill="#2a6950" font-weight="700" text-anchor="start">Proposal</text><text x="1765" y="399" font-size="17" fill="#678477" font-weight="400" text-anchor="start">docs/proposals/*.md</text><path d="M1764 422H2007" stroke="#b9d8c6"/><text x="1765" y="452" font-size="16" fill="#678477" font-weight="400" text-anchor="start">必要时附 Design / Prototype</text><text x="1765" y="480" font-size="16" fill="#678477" font-weight="400" text-anchor="start">docs/design/</text><text x="1765" y="503" font-size="16" fill="#678477" font-weight="400" text-anchor="start">**</text><rect x="1826" y="518" width="159" height="47" rx="25" fill="#e2e7ef" stroke="#94a3b8" stroke-width="2"/><circle cx="1852" cy="542" r="16" fill="#8b5cf6"/><text x="1852" y="549" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">A</text><text x="1878" y="549" font-size="16" fill="#334155" font-weight="650" text-anchor="start">发起 Bits MR</text><rect x="1728" y="594" width="301" height="290" rx="28" fill="#fffbf2" stroke="#f6be69" stroke-width="2"/><circle cx="1778" cy="645" r="32" fill="#f59e0b"/><text x="1778" y="652" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">H</text><text x="1822" y="641" font-size="23" fill="#785526" font-weight="650" text-anchor="start">Approval Review</text><text x="1822" y="669" font-size="15" fill="#94764c" font-weight="400" text-anchor="start">Leader + Project Owner</text><rect x="1758" y="704" width="242" height="60" rx="16" fill="#fff1d9" stroke="#f7c67e" stroke-width="2"/><text x="1878" y="742" font-size="20" fill="#785526" font-weight="650" text-anchor="middle">只 review 已形成产出</text><text x="1758" y="796" font-size="14" fill="#94764c" font-weight="400" text-anchor="start">不 review 内部提问、调查或 Brainstorm</text><rect x="1758" y="824" width="110" height="35" rx="19" fill="#fff0eb" stroke="#ffb8a7" stroke-width="2"/><text x="1813" y="848" font-size="15" fill="#a35743" font-weight="650" text-anchor="middle">Feedback</text><rect x="1890" y="824" width="111" height="35" rx="19" fill="#e8f7ed" stroke="#9fdbb5" stroke-width="2"/><text x="1945" y="848" font-size="15" fill="#327456" font-weight="650" text-anchor="middle">Accepted</text><rect x="1758" y="975" width="242" height="103" rx="8" fill="#edf3ff" stroke="#92b6ff" stroke-width="2"/><text x="1879" y="1015" font-size="26" fill="#365580" font-weight="700" text-anchor="middle">SDD 工作流</text><text x="1879" y="1048" font-size="17" fill="#5d7ba1" font-weight="400" text-anchor="middle">实现 · 测试 · 技术 Review</text><rect x="1230" y="946" width="290" height="38" rx="20" fill="#fff0eb" stroke="#ffc3b3" stroke-width="2"/><text x="1375" y="972" font-size="16" fill="#a35743" font-weight="650" text-anchor="middle">Feedback 返回整个 Formation Loop</text><rect x="1013" y="1005" width="557" height="45" rx="23" fill="#f3edff" stroke="#d1bdff" stroke-width="2"/><text x="1291" y="1034" font-size="16" fill="#8051d8" font-weight="650" text-anchor="middle">TDD 工作流中 新事实返回整个 SDD · 通常在后续 MR 中可见</text></svg>
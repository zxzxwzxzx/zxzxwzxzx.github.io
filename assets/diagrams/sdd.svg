<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1141" viewBox="0 0 2048 1141" role="img" aria-labelledby="title desc"><title id="title">SDD：明确目标和验收标准</title><desc id="desc">依据用户提供的流程图重绘：各类需求进入由人和 Agent 协作的六步循环，形成 Proposal 后审批，并根据反馈继续迭代。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="2048" height="1141" fill="#fff"/><text x="34" y="48" font-size="38" fill="#172235" font-weight="700" text-anchor="start">SDD：明确目标和验收标准</text><text x="35" y="91" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">RD 与 Agent 留在内部形成循环，项目负责人只审批跨越输出边界的 Review-ready 产出</text><rect x="1698" y="68" width="162" height="39" rx="20" fill="#fff" stroke="#93b5ff" stroke-width="2"/><circle cx="1723" cy="88" r="13" fill="#3b82f6"/><text x="1723" y="95" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">H</text><text x="1747" y="95" font-size="17" fill="#334155" font-weight="600" text-anchor="start">人</text><rect x="1875" y="68" width="163" height="39" rx="20" fill="#fff" stroke="#c4aaff" stroke-width="2"/><circle cx="1899" cy="88" r="13" fill="#8b5cf6"/><text x="1899" y="95" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">A</text><text x="1922" y="95" font-size="17" fill="#594478" font-weight="600" text-anchor="start">Agent</text><rect x="33" y="135" width="290" height="756" rx="28" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="2"/><text x="62" y="182" font-size="27" fill="#253247" font-weight="700" text-anchor="start">需求</text><text x="62" y="213" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">全部汇入 Decision Loop</text><rect x="667" y="135" width="1005" height="756" rx="5" fill="#fbfcff" stroke="#b5cafa" stroke-width="2"/><rect x="680" y="156" width="480" height="38" rx="20" fill="#e9f0ff" stroke="#e9f0ff" stroke-width="2"/><text x="702" y="184" font-size="25" fill="#365580" font-weight="700" text-anchor="start">SDD 工作流</text><text x="702" y="224" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">六步环绕同一协作中心；每一步都由承接 RD 与 AI 共同推进</text><ellipse cx="1185" cy="543" rx="409" ry="259" fill="none" stroke="#dbe5f2" stroke-width="2" stroke-dasharray="5 5"/><path d="M325 297H387" fill="none" stroke="#adb5be" stroke-width="3" marker-end="url(#arrow)"/><path d="M585 297H663" fill="none" stroke="#adb5be" stroke-width="3" marker-end="url(#arrow)"/><path d="M847 352V295H1010" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/><path d="M1350 295H1520V342" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/><path d="M1520 451V598" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/><path d="M1520 707V802H1360" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/><path d="M1019 802H847V716" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/><path d="M847 608V460" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/><path d="M1343 518V628" fill="none" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/><path d="M1024 635V526" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/><path d="M1678 323H1727" fill="none" stroke="#adb5be" stroke-width="3" marker-end="url(#arrow)"/><path d="M1880 511V585" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/><path d="M1812 858V965H462V520H303" fill="none" stroke="#ee7159" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/><path d="M1878 888V964" fill="none" stroke="#cedaff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1752 1026H1568" fill="none" stroke="#cedaff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1009 1026H406Q389 1026 389 1009V781Q389 765 372 765H300" fill="none" stroke="#cedaff" stroke-width="3" marker-end="url(#arrow)"/><path d="M487 350V1119H1878V1085" fill="none" stroke="#bda5fa" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/><rect x="62" y="245" width="233" height="95" rx="19" fill="#edf4ff" stroke="#3b82f6" stroke-width="2"/><circle cx="88" cy="278" r="10" fill="#3b82f6"/><text x="88" y="285" font-size="20" fill="#fff" font-weight="600" text-anchor="middle"></text><text x="112" y="284" font-size="19" fill="#374151" font-weight="650" text-anchor="start">新需求 / 变更</text><text x="112" y="314" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">目标、范围、产品输入</text><rect x="62" y="359" width="233" height="95" rx="19" fill="#fff7e9" stroke="#f59e0b" stroke-width="2"/><circle cx="88" cy="392" r="10" fill="#f59e0b"/><text x="88" y="399" font-size="20" fill="#fff" font-weight="600" text-anchor="middle"></text><text x="112" y="398" font-size="19" fill="#374151" font-weight="650" text-anchor="start">Bug / 事故</text><text x="112" y="428" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">现象、日志、复现路径</text><rect x="62" y="473" width="233" height="95" rx="19" fill="#fff0ec" stroke="#ef7059" stroke-width="2"/><circle cx="88" cy="506" r="10" fill="#ef7059"/><text x="88" y="513" font-size="20" fill="#fff" font-weight="600" text-anchor="middle"></text><text x="112" y="512" font-size="19" fill="#374151" font-weight="650" text-anchor="start">Review 反馈</text><text x="112" y="542" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">对 Proposal 产出的反馈</text><rect x="62" y="587" width="233" height="95" rx="19" fill="#eaf8f2" stroke="#25a778" stroke-width="2"/><circle cx="88" cy="620" r="10" fill="#25a778"/><text x="88" y="627" font-size="20" fill="#fff" font-weight="600" text-anchor="middle"></text><text x="112" y="626" font-size="19" fill="#374151" font-weight="650" text-anchor="start">架构 / 技术事项</text><text x="112" y="656" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">协议、运行时、长期结构</text><rect x="62" y="702" width="233" height="128" rx="19" fill="#f3edff" stroke="#8b5cf6" stroke-width="2"/><circle cx="88" cy="735" r="10" fill="#8b5cf6"/><text x="88" y="742" font-size="20" fill="#fff" font-weight="600" text-anchor="middle"></text><text x="112" y="741" font-size="19" fill="#374151" font-weight="650" text-anchor="start">Build 中的新事实</text><text x="112" y="771" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">新约束、风险、实现发现</text><text x="112" y="795" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">后续通常在 MR 中可见</text><rect x="320" y="246" width="69" height="31" rx="16" fill="#fff" stroke="#dbe3eb" stroke-width="2"/><text x="355" y="268" font-size="14" fill="#617080" font-weight="600" text-anchor="middle">所有输入</text><rect x="594" y="246" width="70" height="31" rx="16" fill="#fff" stroke="#dbe3eb" stroke-width="2"/><text x="629" y="268" font-size="14" fill="#617080" font-weight="600" text-anchor="middle">信息不足</text><rect x="390" y="246" width="194" height="99" rx="9" fill="#f1ebff" stroke="#b69afa" stroke-width="2"/><circle cx="427" cy="285" r="22" fill="#b69afa"/><text x="427" y="292" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">A</text><text x="458" y="282" font-size="19" fill="#334155" font-weight="650" text-anchor="start">AI</text><text x="458" y="310" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">识别需求复杂度</text><rect x="404" y="400" width="185" height="36" rx="8" fill="#fff" stroke="#fff" stroke-width="2"/><text x="422" y="425" font-size="17" fill="#475569" font-weight="400" text-anchor="start">小优化、问题修复</text><rect x="1020" y="251" width="329" height="89" rx="9" fill="#eaf2ff" stroke="#8eb6ff" stroke-width="2"/><circle cx="1057" cy="290" r="22" fill="#8eb6ff"/><text x="1057" y="297" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">1</text><text x="1088" y="287" font-size="19" fill="#334155" font-weight="650" text-anchor="start">提问澄清（从此开始）</text><text x="1088" y="315" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">对齐目标、范围与验收口径</text><rect x="1386" y="352" width="269" height="99" rx="9" fill="#f5efff" stroke="#c4adff" stroke-width="2"/><circle cx="1423" cy="391" r="22" fill="#c4adff"/><text x="1423" y="398" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">2</text><text x="1454" y="388" font-size="19" fill="#334155" font-weight="650" text-anchor="start">事实调查</text><text x="1454" y="416" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">检索、复现、代码与历史证据</text><rect x="1386" y="608" width="269" height="99" rx="9" fill="#fff7e8" stroke="#ffc36a" stroke-width="2"/><circle cx="1423" cy="647" r="22" fill="#ffc36a"/><text x="1423" y="654" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">3</text><text x="1454" y="644" font-size="19" fill="#334155" font-weight="650" text-anchor="start">必要时 Brainstorm</text><text x="1454" y="672" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">探索候选方案与关键取舍</text><rect x="1020" y="759" width="329" height="99" rx="9" fill="#e9f7f5" stroke="#8bd4cf" stroke-width="2"/><circle cx="1057" cy="798" r="22" fill="#8bd4cf"/><text x="1057" y="805" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">4</text><text x="1088" y="795" font-size="19" fill="#334155" font-weight="650" text-anchor="start">拟定 Proposal / Prototype</text><text x="1088" y="823" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">判断所需产物与深度，沉淀为可</text><text x="1088" y="846" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">review 内容</text><rect x="701" y="608" width="281" height="99" rx="9" fill="#ebf8f0" stroke="#9bdac2" stroke-width="2"/><circle cx="738" cy="647" r="22" fill="#9bdac2"/><text x="738" y="654" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">5</text><text x="769" y="644" font-size="15" fill="#334155" font-weight="650" text-anchor="start">AI 自检、挑战与修订、Grill</tex
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" role="img" aria-labelledby="title desc"><title id="title">AI 面试平台内外网架构</title><desc id="desc">内网管理端和 RDS 通过快照发布与结果回收连接公网面试运行态。公网通过语音网关保存双轨录音、转写和提交清单，不能连接内部数据库。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#8ba3c0" stroke-width="1.5"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#293b53;text-anchor:middle}.title{font-size:17px;font-weight:600}.sub{font-size:13px;fill:#64768e}.edge{font-size:12px;fill:#64768e;paint-order:stroke;stroke:#f8fbff;stroke-width:6px}.wire{fill:none;stroke:#8ba3c0;stroke-width:1.7}</style><rect width="960" height="770" rx="10" fill="#f8fbff"/><text x="24" y="29" class="sub" style="text-anchor:start">AI INTERVIEW / 管理面、运行态、语音与结果同步</text><rect x="18" y="54" width="386" height="634" rx="12" fill="#f0f5fc"/><rect x="556" y="54" width="386" height="634" rx="12" fill="#f0f5fc"/><text x="212" y="78" class="sub">内网 · 管理与权威数据</text><text x="748" y="78" class="sub">公网 · 面试与音频采集</text><path d="M480 70V680" stroke="#aebfd3" stroke-dasharray="5 6"/><path d="M212 184V218" class="wire" marker-end="url(#arrow)"/><path d="M212 302V338" class="wire" marker-end="url(#arrow)"/><path d="M372 382H586" class="wire" marker-end="url(#arrow)"/><text x="480" y="365" class="edge">签名发布快照</text><path d="M748 184V338" class="wire" marker-end="url(#arrow)"/><text x="748" y="254" class="edge">邀请兑换 / 授权 / 设备检查</text><path d="M748 424V458" class="wire" marker-end="url(#arrow)"/><path d="M748 544V578" class="wire" marker-end="url(#arrow)"/><path d="M588 622H374" class="wire" marker-end="url(#arrow)"/><text x="480" y="604" class="edge">内网主动拉取结果</text><path d="M52 622H34V260H50" class="wire" marker-end="url(#arrow)"/><rect x="52" y="100" width="320" height="84" rx="9" fill="#eaf3ff" stroke="#85aad5"/><text x="212.0" y="128" class="title">管理端 · SSO / 角色权限</text><text x="212.0" y="149" class="sub">候选人、面试、题库、邀请</text><text x="212.0" y="167" class="sub">录音回放、转写与人工复核</text><rect x="52" y="220" width="320" height="84" rx="9" fill="#eaf3ff" stroke="#85aad5"/><text x="212.0" y="248" class="title">内部 RDS</text><text x="212.0" y="269" class="sub">面试定义 / 配置快照 / 复核结果</text><text x="212.0" y="287" class="sub">业务数据的权威存储</text><rect x="52" y="340" width="320" height="84" rx="9" fill="#eaf3ff" stroke="#85aad5"/><text x="212.0" y="368" class="title">Snapshot Publisher</text><text x="212.0" y="389" class="sub">发布队列 / 租约领取 / 幂等发布</text><text x="212.0" y="407" class="sub">配置固化后下发公网</text><rect x="52" y="580" width="320" height="84" rx="9" fill="#eaf3ff" stroke="#85aad5"/><text x="212.0" y="608" class="title">Result Collector</text><text x="212.0" y="629" class="sub">游标发现 / 租约领取 / 身份校验</text><text x="212.0" y="647" class="sub">回收事件、清单与音频引用</text><rect x="588" y="100" width="320" height="84" rx="9" fill="#eaf3ff" stroke="#85aad5"/><text x="748.0" y="128" class="title">候选人面试端</text><text x="748.0" y="149" class="sub">邀请链接进入 / 多轮语音面试</text><text x="748.0" y="167" class="sub">受面试配置与授权约束</text><rect x="588" y="340" width="320" height="84" rx="9" fill="#eaf3ff" stroke="#85aad5"/><text x="748.0" y="368" class="title">公网运行态</text><text x="748.0" y="389" class="sub">本地持久化 / 次数与硬截止</text><text x="748.0" y="407" class="sub">独立运行，不连接内部数据库</text><rect x="588" y="460" width="320" height="84" rx="9" fill="#eaf3ff" stroke="#85aad5"/><text x="748.0" y="488" class="title">受限 Voice Gateway</text><text x="748.0" y="509" class="sub">会话授权 / 语音能力适配</text><text x="748.0" y="527" class="sub">话题状态 / 双方转写</text><rect x="588" y="580" width="320" height="84" rx="9" fill="#eaf3ff" stroke="#85aad5"/><text x="748.0" y="608" class="title">音频对象 + 提交清单</text><text x="748.0" y="629" class="sub">TOS 双轨录音 / 回答与转写</text><text x="748.0" y="647" class="sub">不可变标识 / 内容哈希</text><text x="212" y="493" class="sub">发布与回收分别使用同步身份</text><text x="212" y="519" class="sub">签名 · 时间戳 · nonce 校验</text><rect x="24" y="711" width="912" height="40" rx="7" fill="#f0f5fc"/><text x="480" y="736" class="sub">箭头表示数据流向；跨边界请求均由内网主动发起。图示按仓库实现整理。</text></svg>
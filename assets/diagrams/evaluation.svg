<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc"><title id="title">自动化竞品评测：三维定位与多 Agent 修复设计</title><desc id="desc">围绕硬件、浏览器、模型应用三个维度定位异常。证据汇总、修复、测试和恢复验收为建议扩展设计。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#8ba3c0" stroke-width="1.5"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#293b53;text-anchor:middle}.title{font-size:17px;font-weight:600}.sub{font-size:13px;fill:#64768e}.edge{font-size:12px;fill:#64768e;paint-order:stroke;stroke:#f8fbff;stroke-width:5px}.start{text-anchor:start}.end{text-anchor:end}.wire{fill:none;stroke:#8ba3c0;stroke-width:1.7}</style><rect width="960" height="820" rx="10" fill="#f8fbff"/><text x="24" y="29" class="sub start">AGENT DESIGN / 三维定位 → 修复 → 测试 → 恢复验收</text><rect x="24" y="49" width="912" height="74" rx="9" fill="#f0f5fc"/><text x="60" y="77" class="sub start">采集主链路</text><text x="60" y="103" class="title start">10+ 模型 → 回环采集 / 批量测试 → 评测数据</text><text x="900" y="93" class="sub end">持续运行</text><path d="M480 123V161" class="wire" marker-end="url(#arrow)" /><text x="535" y="146" class="edge">异常触发</text><g><rect x="352" y="165" width="256" height="68" rx="9" fill="#eaf3ff" stroke="#85aad5" /><text x="480.0" y="193" class="title">监控与任务协调</text><text x="480.0" y="214" class="sub">记录采集异常，组织问题定位</text></g><path d="M480 233V256H160V288" class="wire" marker-end="url(#arrow)" /><path d="M480 233V288" class="wire" marker-end="url(#arrow)" /><path d="M480 256H800V288" class="wire" marker-end="url(#arrow)" /><g><rect x="32" y="292" width="256" height="84" rx="9" fill="#eaf3ff" stroke="#85aad5" /><text x="160.0" y="320" class="title">硬件定位 Agent</text><text x="160.0" y="341" class="sub">定位维度：设备与采集链路</text><text x="160.0" y="360" class="sub">建议检查：设备状态、录音信号</text></g><g><rect x="352" y="292" width="256" height="84" rx="9" fill="#eaf3ff" stroke="#85aad5" /><text x="480.0" y="320" class="title">浏览器定位 Agent</text><text x="480.0" y="341" class="sub">定位维度：页面与自动化运行</text><text x="480.0" y="360" class="sub">建议检查：权限、会话、页面状态</text></g><g><rect x="672" y="292" width="256" height="84" rx="9" fill="#eaf3ff" stroke="#85aad5" /><text x="800.0" y="320" class="title">模型应用定位 Agent</text><text x="800.0" y="341" class="sub">定位维度：应用响应与交互</text><text x="800.0" y="360" class="sub">建议检查：响应错误、超时、轮次</text></g><path d="M160 376V405H480V438" class="wire" marker-end="url(#arrow)" /><path d="M480 376V438" class="wire" marker-end="url(#arrow)" /><path d="M800 376V405H480" class="wire" /><g><rect x="352" y="442" width="256" height="68" rx="9" fill="#fbf4e8" stroke="#ab8150" stroke-dasharray="5 4"/><text x="480.0" y="470" class="title">证据汇总与修复派发</text><text x="480.0" y="491" class="sub">归因依据 / 影响范围 / 修复建议</text></g><path d="M480 510V531H160V563" class="wire" marker-end="url(#arrow)" stroke-dasharray="5 4"/><g><rect x="32" y="567" width="256" height="84" rx="9" fill="#fbf4e8" stroke="#ab8150" stroke-dasharray="5 4"/><text x="160.0" y="595" class="title">修复 Agent</text><text x="160.0" y="616" class="sub">按归因执行受限修复</text><text x="160.0" y="635" class="sub">保留操作记录与回退方式</text></g><g><rect x="352" y="567" width="256" height="84" rx="9" fill="#fbf4e8" stroke="#ab8150" stroke-dasharray="5 4"/><text x="480.0" y="595" class="title">测试 Agent</text><text x="480.0" y="616" class="sub">复现失败用例，运行回归</text><text x="480.0" y="635" class="sub">验证录音、轮次与输出完整性</text></g><g><rect x="672" y="567" width="256" height="84" rx="9" fill="#fbf4e8" stroke="#ab8150" stroke-dasharray="5 4"/><text x="800.0" y="595" class="title">恢复验收 Agent</text><text x="800.0" y="616" class="sub">小批量恢复并观察采集</text><text x="800.0" y="635" class="sub">确认稳定后恢复正常任务</text></g><path d="M288 609H348" class="wire" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="320" y="592" class="edge">待验修复</text><path d="M608 609H668" class="wire" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="640" y="592" class="edge">测试通过</text><path d="M480 651V692H160V655" class="wire" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="320" y="684" class="edge">测试失败：带证据返回修复</text><rect x="32" y="731" width="896" height="66" rx="8" fill="#f0f5fc"/><text x="480" y="757" class="sub">建议退出条件：证据不足、超出修复范围、重试用尽或验收失败 → 人工处理</text><text x="480" y="781" class="sub">蓝色：采集守护与已确认定位维度　·　金色虚线：建议扩展设计</text></svg>